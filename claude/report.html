function renderTurnDetails(turnDetails) {
  if (!turnDetails || !turnDetails.length) return '<div style="padding:8px;color:var(--muted);font-size:11px">No turn data available</div>';

  const shortModel = m => {
    if (m.includes('opus')) return 'opus';
    if (m.includes('haiku')) return 'haiku';
    if (m.includes('sonnet')) return 'sonnet';
    return m.slice(0, 12);
  };

  // Cowork sessions have tool-call turn details — show a different table
  if (turnDetails[0]?.isCoworkTool) {
    const rows = turnDetails.map((t, i) => {
      const time = t.ts ? new Date(t.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '—';
      return `<tr>
        <td class="turn-num">${i + 1}</td>
        <td class="turn-time">${time}</td>
        <td class="turn-model" style="color:var(--accent)">${t.toolName || '?'}</td>
        <td class="turn-tokens" style="color:var(--muted);max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" colspan="4">${escHtml(t.toolInput || '')}</td>
      </tr>`;
    }).join('');
    return `<table class="turn-table">
      <tr><th>#</th><th>Time</th><th>Tool</th><th colspan="4">Input</th></tr>
      ${rows}
    </table>`;
  }

  const rows = turnDetails.map((t, i) => {
    const time = t.ts ? new Date(t.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '—';
    const costStr = t.cost < 0.001 ? '$' + t.cost.toFixed(5) : '$' + t.cost.toFixed(4);
    const extraTag = t.extra ? '<span class="turn-extra"> EXTRA</span>' : '';
    return `<tr>
      <td class="turn-num">${i + 1}</td>
      <td class="turn-time">${time}</td>
      <td class="turn-model">${shortModel(t.model)}</td>
      <td class="turn-tokens">${fmtNum(t.in)} in</td>
      <td class="turn-tokens">${fmtNum(t.out)} out</td>
      <td class="turn-tokens">${fmtNum(t.cr)} cache</td>
      <td class="turn-cost">${costStr}${extraTag}</td>
    </tr>`;
  }).join('');

  return `<table class="turn-table">
    <tr><th>#</th><th>Time</th><th>Model</th><th>Input</th><th>Output</th><th>Cache Read</th><th>Cost</th></tr>
    ${rows}
  </table>`;
}

// Shared feed item renderer used by both Overview and Command Feed tabs
function renderFeedItems(items) {
  if (!items.length) return '';
  // Assign sequential window color index by 5h bucket (time-sorted so adjacent
  // windows always get different colors regardless of display order)
  const timeSorted = [...items].sort((a, b) => a.timestamp - b.timestamp);
  let wIdx = 0, prevBkt = null;
  const bucketColor = {};
  for (const h of timeSorted) {
    const bkt = Math.floor(h.timestamp / WIN_MS);
    if (prevBkt !== null && bkt !== prevBkt) wIdx++;
    prevBkt = bkt;
    bucketColor[bkt] = wIdx;
  }
  return `<div class="feed">${items.map((h, idx) => {
    const d = new Date(h.timestamp);
    const itemDay = laDateStr(d);
    const proj = (h.project || '').split('/').slice(-2).join('/');
    const itemId = (h.sessionId || '') + '_' + h.timestamp;
    const bkt = Math.floor(h.timestamp / WIN_MS);
    const borderColor = WIN_COLORS[(bucketColor[bkt] ?? 0) % WIN_COLORS.length];
    const isExpanded = state.expandedFeedItems.has(itemId);

    let pill;
    let costSummary = '';
    let costlyBadge = '';
    let costlyReason = '';
    let costlyClass = '';
    if (typeof h.cost !== 'number') {
      pill = `<span class="cost-pill na" title="No transcript data">—</span>`;
    } else {
      const cost = h.cost;
      const turns = h.turns || 0;
      const cls = cost === 0 ? 'zero' : cost < 0.01 ? '' : cost < 0.10 ? 'mid' : 'high';
      const label = cost === 0 ? '$0.00' : cost < 0.01 ? '$' + cost.toFixed(4) : '$' + cost.toFixed(3);
      const c = h.tokenCounts || {};
      const extraCost = h.extraCost || 0;
      const extraNote = extraCost > 0 ? `  ·  $${extraCost.toFixed(3)} EXTRA CREDIT` : '';
      const tip = `${turns} turn${turns === 1 ? '' : 's'}  ·  ${fmtNum(c.input_tokens)} in  ·  ${fmtNum(c.output_tokens)} out  ·  ${fmtNum(c.cache_read_input_tokens)} cache read  ·  ${fmtNum(c.cache_creation_input_tokens)} cache write${extraNote}`;
      const extraBadge = extraCost > 0 ? '<span style="color:var(--red);font-size:9px;margin-left:4px">EXTRA</span>' : '';
      pill = `<span class="cost-pill ${cls}" title="${tip}">${label}<span style="font-weight:400;opacity:0.7"> · ${turns} turns</span>${extraBadge}</span>`;

      const outputTokens = c.output_tokens || 0;
      const cacheWriteTokens = c.cache_creation_input_tokens || 0;
      const signalParts = [];
      let reason = '';
      if (extraCost > 0) reason = 'extra credit';
      else if (cacheWriteTokens >= 500000) reason = 'cache write';
      else if (outputTokens >= 100000) reason = 'high output';
      else if (turns >= 12) reason = 'many turns';

      const isCostly = cost >= 0.10 || extraCost > 0 || outputTokens >= 100000 || cacheWriteTokens >= 500000 || turns >= 12;
      if (isCostly) {
        costlyClass = ' costly';
        costlyBadge = renderKindBadge('Expensive', 'costly');
        costlyReason = reason ? renderKindBadge(reason, 'cost-reason') : '';
        if (outputTokens >= 50000) signalParts.push(`${fmtNum(outputTokens)} out`);
        if (cacheWriteTokens >= 100000) signalParts.push(`${fmtNum(cacheWriteTokens)} cache write`);
        if (extraCost > 0) signalParts.push(`$${extraCost.toFixed(2)} extra`);
        costSummary = signalParts.length ? `<div class="feed-cost-summary">${signalParts.map(s => `<span>${escHtml(s)}</span>`).join('')}</div>` : '';
      }
    }

    const expandIcon = h.turnDetails && h.turnDetails.length ? `<span style="color:var(--muted);font-size:10px;margin-right:4px">${isExpanded ? '▼' : '▶'}</span>` : '';
    const details = isExpanded ? renderTurnDetails(h.turnDetails) : '';

    let costTips = '';
    if (isExpanded && typeof h.cost === 'number') {
      const cost = h.cost, turns = h.turns || 0;
      const c = h.tokenCounts || {};
      const outputTokens = c.output_tokens || 0;
      const cacheWriteTokens = c.cache_creation_input_tokens || 0;
      const cacheReadTokens = c.cache_read_input_tokens || 0;
      const extraCost = h.extraCost || 0;
      const isCostly = cost >= 0.10 || extraCost > 0 || outputTokens >= 100000 || cacheWriteTokens >= 500000 || turns >= 12;
      if (isCostly) {
        const tips = [];
        if (extraCost > 0) tips.push('Extra credit was charged — this ran after hitting a rate-limit window. Spreading work across windows or waiting for a reset avoids extra-credit charges.');
        if (cacheWriteTokens >= 200000) tips.push('Large cache-write volume. Shorter, stable system prompts and reusing existing context reduce cache-write charges on future turns.');
        if (outputTokens >= 100000) tips.push('High output volume. Ask Claude to be concise, use bullet points, or split a large task into focused sub-prompts to reduce output tokens.');
        if (turns >= 12) tips.push('Long session with many turns. Front-loading context and instructions into fewer, more specific prompts reduces per-turn overhead.');
        if (cacheReadTokens === 0 && cacheWriteTokens >= 50000) tips.push('Cache was written but not read. Prompt caching pays off when the same prefix is reused across multiple turns.');
        if (cost >= 0.10 && tips.length === 0) tips.push('High total cost. Try breaking this task into smaller, focused prompts to avoid token overhead from accumulated context.');
        if (tips.length) {
          costTips = `<div style="margin-top:10px;padding:10px 12px;background:rgba(217,119,6,0.07);border:1px solid rgba(217,119,6,0.22);border-radius:6px;font-size:11px">
            <div style="font-weight:700;color:var(--accent);margin-bottom:6px;font-size:11px">Cost-saving suggestions</div>
            ${tips.map(t => `<div style="color:var(--muted);line-height:1.5;margin-bottom:4px">• ${t}</div>`).join('')}
          </div>`;
        }
      }
    }

    const badge = h.isCowork ? renderKindBadge('Scheduled Task') : '';
    const sessionPreview = h.sessionId ? `${h.sessionId.slice(0, 8)}…` : '—';

    return `<div class="feed-item${h.isCowork ? ' cowork' : ''}${costlyClass}" data-project="${escAttr(h.project || '')}" data-day="${itemDay}" style="border-left:3px solid ${borderColor}" onclick="toggleFeedItem('${itemId}')" onmouseenter="setHoverProject('${escAttr(h.project || '')}');setHoverDay('${itemDay}')" onmouseleave="clearHoverProject('${escAttr(h.project || '')}');clearHoverDay()">
      <div class="feed-head">
        ${expandIcon}<div class="feed-copy">
          <div class="feed-title-row">
            ${badge}
            ${costlyBadge}
            ${costlyReason}
            <div class="prompt-text">${escHtml(h.display || '')}</div>
          </div>
          ${costSummary}
          <div class="prompt-meta">
            <span class="project">${escHtml(proj)}</span>
            <span>${d.toLocaleString()}</span>
            <span style="color:var(--muted);font-size:10px">${escHtml(sessionPreview)}</span>
          </div>
        </div>
        ${pill}
      </div>
      ${costTips}
      ${details}
    </div>`;
  }).join('')}</div>`;
}

function jumpToToolRow(targetIdx) {
  const feed = document.getElementById('tool-feed');
  const countEl = document.getElementById('tool-feed-count');
  if (!feed) return;
  // Pre-render rows up to targetIdx if not yet loaded
  if (targetIdx >= state.toolRenderedCount) {
    const startOff = state.toolRenderedCount;
    const batch = state.toolAnnotated.slice(startOff, targetIdx + 1);
    feed.insertAdjacentHTML('beforeend', batch.map((item, i) => toolEventRow(item, startOff + i)).join(''));
    state.toolRenderedCount = targetIdx + 1;
    if (countEl) countEl.textContent = `(${state.toolRenderedCount} of ${state.toolAnnotated.length})`;
  }
  const target = feed.querySelector(`[data-idx="${targetIdx}"]`);
  if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function onFeedSearchOverview(val) {
  state.feedSearch = val;
  renderOverview();
  // Restore focus and cursor
  const inp = document.getElementById('feedSearchInput');
  if (inp) { inp.focus(); inp.selectionStart = inp.selectionEnd = inp.value.length; }
}

function filterBySearch(items) {
  const q = (state.feedSearch || '').trim().toLowerCase();
  if (!q) return items;
  return items.filter(h => {
    const text = (h.display || '').toLowerCase();
    const proj = (h.project || '').toLowerCase();
    return text.includes(q) || proj.includes(q);
  });
}

const TOOL_PAGE = 50;
const WIN_COLORS = ['#58a6ff','#3fb950','#d97706','#a78bfa','#22d3ee','#f472b6','#fb923c','#34d399'];
const WIN_MS = 5 * 60 * 60 * 1000;

function toolWindowBucket(ts) {
  return Math.floor(new Date(ts).getTime() / WIN_MS);
}

// Annotate events (newest-first) with a sequential window index that increments
// each time the 5h epoch bucket changes. This ensures adjacent windows always
// get different colors regardless of how many buckets apart they are.
function annotateToolWindows(events) {
  let winIdx = 0, prevBucket = null;
  return events.map(e => {
    const bucket = toolWindowBucket(e.timestamp);
    if (prevBucket !== null && bucket !== prevBucket) winIdx++;
    prevBucket = bucket;
    return { e, winIdx };
  });
}

function toolEventRow({ e, winIdx }, idx) {
  const tool = e.tool_name || 'unknown';
  const tagClass = tool === 'Bash' ? 'bash' : tool.startsWith('Edit') || tool.startsWith('Write') ? 'edit' : 'tool';
  const input = e.tool_input ? JSON.stringify(e.tool_input).slice(0, 80) : '';
  const color = WIN_COLORS[winIdx % WIN_COLORS.length];
  const badge = e.isCowork ? renderKindBadge('Scheduled Task') : '';
  const project = e.project ? `<span style="color:var(--cowork-text)">${escHtml((e.project || '').split('/').slice(-2).join('/'))}</span>` : '';
  return `<div class="feed-item${e.isCowork ? ' cowork' : ''}" data-idx="${idx}" data-project="${escAttr(e.project || '')}" style="border-left:3px solid ${color}" onmouseenter="setHoverProject('${escAttr(e.project || '')}')" onmouseleave="clearHoverProject('${escAttr(e.project || '')}')">
    <div class="prompt-meta" style="margin:0">
      <span style="color:var(--muted)">${new Date(e.timestamp).toLocaleString()}</span>
      ${badge}
      <span class="tag ${tagClass}">${tool}</span>
      <span class="tag" style="background:rgba(255,255,255,0.05);color:var(--muted)">${e.event_type}</span>
      ${project}
    </div>
    <div class="prompt-text" style="margin-top:6px;font-size:12px;color:var(--muted)">${escHtml(input)}</div>
  </div>`;
}

function renderTools() {
  if (state.toolObserver) { state.toolObserver.disconnect(); state.toolObserver = null; }

  const filtered = filteredEvents();
  const toolCounts = {};
  for (const e of filtered) {
    const tool = e.tool_name || e.toolName || 'unknown';
    toolCounts[tool] = (toolCounts[tool] || 0) + 1;
  }
  const entries = Object.entries(toolCounts).sort((a, b) => b[1] - a[1]);

  if (!entries.length) {
    document.getElementById('tabContent').innerHTML = `<div class="no-data">No matching tool events.</div>`;
    applyHoverProjectSync();
    return;
  }

  const allAnnotated = annotateToolWindows([...filtered].reverse());

  // Compute targets for quick-jump links (newest-first list, so "older" = higher index)
  const dws = window.TRACKER_DATA?.windowUsage?.detectedWindows || [];
  const now = Date.now();
  const curWin = [...dws].reverse().find(w => w.startEpoch <= now) || null;
  const prevWin = curWin ? [...dws].reverse().find(w => w.endEpoch <= curWin.startEpoch) : null;
  const { start: todayStart } = todayPTRange();
  // "prev window" jumps to the most recent event in that window — in newest-first order
  // that's the first event older than the current window's start (≈ last activity before
  // the gap between windows).
  const prevWinTarget = prevWin
    ? allAnnotated.findIndex(({ e }) => new Date(e.timestamp).getTime() < curWin.startEpoch)
    : -1;
  const yesterdayTarget = allAnnotated.findIndex(({ e }) => new Date(e.timestamp).getTime() < todayStart);

  function jumpLink(label, targetIdx) {
    if (targetIdx < 0) return '';
    return `<button onclick="jumpToToolRow(${targetIdx})" style="padding:2px 8px;border:none;border-radius:4px;font-size:11px;cursor:pointer;background:transparent;color:var(--blue);text-decoration:underline">↓ ${label}</button>`;
  }
  const quickLinks = `<div style="display:flex;gap:4px;align-items:center">
    ${jumpLink('prev window', prevWinTarget)}
    ${jumpLink('yesterday', yesterdayTarget)}
  </div>`;

  // Store annotated array on state so jumpToToolRow can access it
  state.toolAnnotated = allAnnotated;
  state.toolRenderedCount = Math.min(TOOL_PAGE, allAnnotated.length);

  const cards = entries.map(([tool, count]) => `
    <div class="tool-card">
      <div class="tool-name">${tool}</div>
      <div class="tool-count">${count}</div>
    </div>`).join('');

  const firstBatch = allAnnotated.slice(0, TOOL_PAGE).map((item, i) => toolEventRow(item, i)).join('');
  document.getElementById('tabContent').innerHTML = `
    <div class="tools-grid">${cards}</div>
    <div class="chart-wrap" style="margin-bottom:12px;display:flex;align-items:center;justify-content:space-between">
      <h3 style="margin:0">Tool events${hasFilters() ? ' · filtered' : ''} <span id="tool-feed-count" style="font-weight:400;color:var(--muted);font-size:13px">(${state.toolRenderedCount} of ${allAnnotated.length})</span></h3>
      ${quickLinks}
    </div>
    <div id="tool-feed" class="feed">${firstBatch || '<div class="no-data">No events</div>'}</div>
    <div id="tool-sentinel" style="height:1px"></div>
  `;
  applyHoverProjectSync();

  let offset = TOOL_PAGE;
  if (offset >= allAnnotated.length) return;

  const feed = document.getElementById('tool-feed');
  const sentinel = document.getElementById('tool-sentinel');
  const countEl = document.getElementById('tool-feed-count');
  const root = document.querySelector('.main');

  const observer = new IntersectionObserver(entries => {
    if (!entries[0].isIntersecting) return;
    const batch = allAnnotated.slice(offset, offset + TOOL_PAGE);
    feed.insertAdjacentHTML('beforeend', batch.map((item, i) => toolEventRow(item, offset + i)).join(''));
    offset += batch.length;
    state.toolRenderedCount = offset;
    countEl.textContent = `(${Math.min(offset, allAnnotated.length)} of ${allAnnotated.length})`;
    if (offset >= allAnnotated.length) { observer.disconnect(); state.toolObserver = null; sentinel.remove(); }
  }, { root, rootMargin: '200px' });

  observer.observe(sentinel);
  state.toolObserver = observer;
}

function fmtNum(n) {
  if (!n) return '0';
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
  if (n >= 1_000) return (n / 1_000).toFixed(1) + 'K';
  return String(n);
}

function renderKindBadge(label, variant = 'cowork') {
  return `<span class="kind-badge ${escAttr(variant)}">${escHtml(label)}</span>`;
}

function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escAttr(s) {
  return (s || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function formatSessionDate(d) {
  const today = new Date().toISOString().slice(0, 10);
  const dateStr = d.toISOString().slice(0, 10);
  if (dateStr === today) {
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

function formatRelative(d) {
  const diff = Date.now() - d.getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  return `${Math.floor(h/24)}d ago`;
}

loadAll();

// --- Page Up/Down scrolls .main ---
document.addEventListener('keydown', e => {
  if (e.key !== 'PageUp' && e.key !== 'PageDown') return;
  const tag = document.activeElement?.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  const main = document.querySelector('.main');
  if (!main) return;
  e.preventDefault();
  main.scrollBy({ top: e.key === 'PageDown' ? main.clientHeight * 0.9 : -main.clientHeight * 0.9, behavior: 'smooth' });
});

// --- Window usage notifications ---
// Polls data.js every 15s; fires a system notification when window pct increases.
(function () {
  let lastPct = null;

  async function notify(oldPct, newPct, wu) {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'default') await Notification.requestPermission();
    if (Notification.permission !== 'granted') return;
    const pct = Math.round(newPct * 100);
    const delta = Math.round((newPct - oldPct) * 100);
    const ceiling = wu?.medianCeiling != null ? ` · ceiling $${wu.medianCeiling.toFixed(2)}` : '';
    new Notification(`Claude window: ${pct}% used (+${delta}%)`, {
      body: `Current window${ceiling}`,
      silent: true,
    });
  }

  async function poll() {
    try {
      const resp = await fetch('data/data.js?t=' + Date.now());
      if (!resp.ok) return;
      const text = await resp.text();
      // Run in a temp global so we don't clobber the live render data
      eval(text.replace(/window\.TRACKER_DATA\b/, 'window.__TD_POLL__'));
      const fresh = window.__TD_POLL__;
      delete window.__TD_POLL__;
      const newPct = fresh?.windowUsage?.pct ?? null;
      if (newPct === null) return;
      if (lastPct !== null && newPct > lastPct) notify(lastPct, newPct, fresh.windowUsage);
      lastPct = newPct;
    } catch (_) {}
  }

  // Seed lastPct from already-loaded data so the first poll doesn't false-fire
  lastPct = window.TRACKER_DATA?.windowUsage?.pct ?? null;
  setInterval(poll, 15000);
})();
</script>
