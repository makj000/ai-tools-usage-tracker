<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="0">
<title>Claude Tracker</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #d97706;
    --green: #3fb950;
    --blue: #58a6ff;
    --purple: #bc8cff;
    --red: #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; font-size: 14px; }

  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 16px; font-weight: 600; color: var(--accent); }
  header .subtitle { color: var(--muted); font-size: 12px; }
  .header-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .total-cost { font-size: 15px; font-weight: 700; color: var(--green); }

  .btn { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font-size: 12px; }
  .btn:hover { background: var(--border); }

  .layout { display: grid; grid-template-columns: 280px 1fr; height: calc(100vh - 53px); }
  .sidebar { background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; display: flex; flex-direction: column; }
  .main { overflow-y: auto; padding: 20px; }

  .stat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 16px; }
  .stat { background: var(--surface); padding: 14px; }
  .stat .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .stat .value { font-size: 22px; font-weight: 700; color: var(--text); }
  .stat .value.green { color: var(--green); }
  .stat .value.blue { color: var(--blue); }
  .stat .value.purple { color: var(--purple); }
  .stat .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .section-title { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; padding: 12px 16px 6px; }

  /* Sidebar project list */
  .sidebar-project { padding: 8px 16px; cursor: pointer; border-bottom: 1px solid var(--border); transition: background 0.1s; display: flex; align-items: center; gap: 8px; user-select: none; }
  .sidebar-project:hover { background: rgba(255,255,255,0.04); }
  .sidebar-project.active { background: rgba(88,166,255,0.08); border-left: 2px solid var(--blue); padding-left: 14px; }
  .sidebar-project .sp-name { font-size: 12px; color: var(--blue); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sidebar-project .sp-cost { font-size: 11px; font-weight: 600; color: var(--green); flex-shrink: 0; }
  .sidebar-project .sp-bar { flex: 0 0 40px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .sidebar-project .sp-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; }

  .session-item { padding: 10px 16px; cursor: pointer; border-bottom: 1px solid var(--border); transition: background 0.1s; }
  .session-item:hover, .session-item.active { background: rgba(255,255,255,0.04); }
  .session-item .project { font-size: 11px; color: var(--blue); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session-item .preview { font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session-item .meta { font-size: 11px; color: var(--muted); margin-top: 3px; display: flex; justify-content: space-between; }
  .session-item .cost-badge { color: var(--green); font-weight: 600; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .card h3 { font-size: 13px; margin-bottom: 12px; color: var(--accent); }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: none; }
  .row .key { color: var(--muted); font-size: 12px; }
  .row .val { font-weight: 600; }
  .val.green { color: var(--green); }
  .val.red { color: var(--red); }
  .val.blue { color: var(--blue); }
  .val.purple { color: var(--purple); }

  .chart-wrap { margin-bottom: 16px; }
  .chart-wrap h3 { font-size: 12px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
  .chart-outer { display: flex; gap: 6px; }
  .y-axis { display: flex; flex-direction: column; justify-content: space-between; padding-bottom: 18px; min-width: 44px; text-align: right; }
  .y-axis span { font-size: 9px; color: var(--muted); white-space: nowrap; }
  .chart-inner { flex: 1; position: relative; }
  .grid-lines { position: absolute; top: 0; left: 0; right: 0; bottom: 18px; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
  .grid-line { border-top: 1px dashed rgba(48,54,61,0.8); width: 100%; }
  .chart { display: flex; align-items: flex-end; gap: 3px; height: 100px; }
  .bar-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; flex: 1; cursor: pointer; }
  .bar-col.active-bar .bar { opacity: 1; box-shadow: 0 0 6px rgba(88,166,255,0.5); }
  .bar-val { font-size: 8px; color: var(--muted); margin-bottom: 2px; white-space: nowrap; }
  .bar { background: var(--accent); opacity: 0.75; width: 100%; border-radius: 2px 2px 0 0; min-height: 1px; transition: opacity 0.2s, box-shadow 0.2s; }
  .bar.green { background: var(--green); }
  .bar:hover { opacity: 1; }
  .bar-label { font-size: 9px; color: var(--muted); margin-top: 3px; }

  .feed { display: flex; flex-direction: column; gap: 8px; }
  .feed-item { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .feed-item .feed-head { display: flex; align-items: flex-start; gap: 12px; }
  .feed-item .prompt-text { font-size: 13px; line-height: 1.5; flex: 1; min-width: 0; word-wrap: break-word; }
  .feed-item .cost-pill { flex-shrink: 0; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 10px; background: rgba(63,185,80,0.12); color: var(--green); white-space: nowrap; cursor: help; }
  .feed-item .cost-pill.zero { background: rgba(139,148,158,0.12); color: var(--muted); }
  .feed-item .cost-pill.mid  { background: rgba(88,166,255,0.12); color: var(--blue); }
  .feed-item .cost-pill.high { background: rgba(217,119,6,0.15); color: var(--accent); }
  .feed-item .cost-pill.na   { background: rgba(139,148,158,0.08); color: var(--muted); font-weight: 500; }
  .feed-item .prompt-meta { font-size: 11px; color: var(--muted); margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .feed-item .project { color: var(--blue); }
  .tag { display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: 10px; font-weight: 600; }
  .tag.tool { background: rgba(88, 166, 255, 0.15); color: var(--blue); }
  .tag.bash { background: rgba(63, 185, 80, 0.15); color: var(--green); }
  .tag.edit { background: rgba(188, 140, 255, 0.15); color: var(--purple); }

  .tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .tool-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; }
  .tool-card .tool-name { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
  .tool-card .tool-count { font-size: 20px; font-weight: 700; color: var(--accent); }

  .project-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); transition: background 0.3s; }
  .project-row:last-child { border-bottom: none; }
  .project-row.highlight { background: rgba(88,166,255,0.12); border-radius: 4px; }
  .project-bar-bg { flex: 1; background: var(--border); border-radius: 2px; height: 6px; overflow: hidden; }
  .project-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; }
  .project-name { font-size: 12px; color: var(--blue); width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
  .project-cost { font-size: 12px; font-weight: 600; color: var(--green); width: 60px; text-align: right; flex-shrink: 0; }

  .token-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .token-box { background: var(--bg); border-radius: 6px; padding: 10px 12px; }
  .token-box .tval { font-size: 16px; font-weight: 700; }
  .token-box .tlabel { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .no-data { color: var(--muted); font-size: 13px; padding: 40px; text-align: center; }

  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .tab { padding: 8px 16px; cursor: pointer; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; transition: color 0.1s; }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab:hover { color: var(--text); }

  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .banner { background: rgba(217,119,6,0.12); border: 1px solid rgba(217,119,6,0.4); border-radius: 6px; padding: 10px 14px; margin-bottom: 14px; font-size: 12px; color: var(--text); display: flex; align-items: center; gap: 10px; }
  .banner code { background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 3px; font-family: ui-monospace, Menlo, monospace; color: var(--accent); }
  .banner .banner-btn { margin-left: auto; padding: 4px 10px; font-size: 11px; border-radius: 4px; border: 1px solid var(--accent); background: var(--accent); color: #000; cursor: pointer; font-weight: 600; }

  /* Filter bar */
  .filter-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; margin-bottom: 12px; background: rgba(88,166,255,0.06); border: 1px solid rgba(88,166,255,0.2); border-radius: 6px; font-size: 12px; }
  .filter-bar .filter-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  .filter-tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; background: rgba(88,166,255,0.12); border-radius: 4px; color: var(--blue); font-size: 12px; font-weight: 600; }
  .filter-tag .remove { cursor: pointer; opacity: 0.6; font-size: 14px; line-height: 1; }
  .filter-tag .remove:hover { opacity: 1; }
  .filter-reset { margin-left: auto; padding: 4px 10px; font-size: 11px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
  .filter-reset:hover { background: var(--border); }
</style>
</head>
<body>

<header>
  <h1>Claude Tracker</h1>
  <span class="subtitle">Commands &amp; Token Usage</span>
  <span id="freshness" style="font-size:11px;color:var(--muted)"></span>
  <div class="header-actions">
    <span id="totalCostHeader" class="total-cost"></span>
    <span style="font-size:10px;color:var(--muted)">equiv. API cost</span>
    <button class="btn" onclick="refresh()">Refresh</button>
  </div>
</header>

<div class="layout">
  <div class="sidebar" id="sidebar">
    <div class="section-title">Top Projects</div>
    <div id="projectList"></div>
    <div class="section-title">Sessions (by equiv. cost)</div>
    <div id="sessionList"><div class="no-data">Loading...</div></div>
  </div>
  <div class="main">
    <div id="cleanupBanner"></div>
    <div id="filterBar"></div>
    <div class="tabs">
      <div class="tab" onclick="showTab('overview')">Overview</div>
      <div class="tab" onclick="showTab('cost')">Token Usage</div>
      <div class="tab" onclick="showTab('tools')">Tool Usage</div>
    </div>
    <div id="tabContent"></div>
  </div>
</div>

<script>
  // Cache-bust data.js so periodic page refreshes always see the freshest build.
  // The hook-triggered build atomically rewrites data.js after each Claude tool use.
  document.write('<scr' + 'ipt src="data.js?t=' + Date.now() + '"></scr' + 'ipt>');
</script>
<script>
let state = {
  stats: null,
  tokens: null,
  history: [],
  events: [],
  activeTab: localStorage.getItem('claude-tracker-tab') || 'overview',
  filterProject: localStorage.getItem('claude-tracker-filterProject') || null,
  filterDay: localStorage.getItem('claude-tracker-filterDay') || null,
  feedSearch: '',
};

// --- helpers for computing per-project per-day data ---
// Build a map: project -> day -> { prompts, cost }
// from history entries (which have per-prompt cost from enrichHistory).
function buildProjectDayMap() {
  const map = {};
  for (const h of state.history) {
    const proj = h.project || '';
    const day = h.timestamp ? new Date(h.timestamp).toISOString().slice(0, 10) : null;
    if (!day) continue;
    if (!map[proj]) map[proj] = {};
    if (!map[proj][day]) map[proj][day] = { prompts: 0, cost: 0 };
    map[proj][day].prompts++;
    map[proj][day].cost += (typeof h.cost === 'number' ? h.cost : 0);
  }
  return map;
}

// Return history entries matching current filters
function filteredHistory() {
  return state.history.filter(h => {
    if (state.filterProject && h.project !== state.filterProject) return false;
    if (state.filterDay) {
      const d = h.timestamp ? new Date(h.timestamp).toISOString().slice(0, 10) : null;
      if (d !== state.filterDay) return false;
    }
    return true;
  });
}

// Return sessions matching current filters
function filteredSessions() {
  const sessions = state.tokens?.sessions || [];
  return sessions.filter(s => {
    if (state.filterProject && s.project !== state.filterProject) return false;
    if (state.filterDay) {
      // session spans days; include if its range overlaps the filter day
      const first = s.firstTs ? s.firstTs.slice(0, 10) : '';
      const last = s.lastTs ? s.lastTs.slice(0, 10) : '';
      if (state.filterDay < first || state.filterDay > last) return false;
    }
    return true;
  });
}

function hasFilters() { return state.filterProject || state.filterDay; }

function setFilter(opts) {
  if ('project' in opts) state.filterProject = opts.project;
  if ('day' in opts) state.filterDay = opts.day;
  persistFilters();
  renderFilterBar();
  renderSidebar();
  renderTab(state.activeTab);
}

function clearFilters() {
  state.filterProject = null;
  state.filterDay = null;
  persistFilters();
  renderFilterBar();
  renderSidebar();
  renderTab(state.activeTab);
}

function persistFilters() {
  if (state.filterProject) localStorage.setItem('claude-tracker-filterProject', state.filterProject);
  else localStorage.removeItem('claude-tracker-filterProject');
  if (state.filterDay) localStorage.setItem('claude-tracker-filterDay', state.filterDay);
  else localStorage.removeItem('claude-tracker-filterDay');
}

function clearFilterProject() { setFilter({ project: null }); }
function clearFilterDay() { setFilter({ day: null }); }

// --- chart builder (with click-to-filter) ---
function buildChart(labels, values, fmt, barClass, chartId) {
  const CHART_H = 100;
  const maxVal = Math.max(...values, 0.0001);
  const mid = maxVal / 2;
  const yTop = fmt(maxVal);
  const yMid = fmt(mid);

  const bars = labels.map((lbl, i) => {
    const v = values[i] || 0;
    const h = Math.max(v > 0 ? 2 : 0, Math.round((v / maxVal) * CHART_H));
    const showVal = v > 0 ? fmt(v) : '';
    const dateLabel = lbl.length === 10 ? lbl.slice(5).replace('-', '/') : lbl;
    const activeClass = state.filterDay === lbl ? 'active-bar' : '';
    return `<div class="bar-col ${activeClass}" title="${lbl}: ${fmt(v)}" onclick="onBarClick('${lbl}')">
      <div class="bar-val">${showVal}</div>
      <div class="bar ${barClass}" style="height:${h}px"></div>
      <div class="bar-label">${dateLabel}</div>
    </div>`;
  }).join('');

  return `<div class="chart-outer">
    <div class="y-axis"><span>${yTop}</span><span>${yMid}</span><span>0</span></div>
    <div class="chart-inner">
      <div class="grid-lines"><div class="grid-line"></div><div class="grid-line"></div><div class="grid-line"></div></div>
      <div class="chart">${bars}</div>
    </div>
  </div>`;
}

function onBarClick(day) {
  // Toggle: clicking same bar again clears filter
  if (state.filterDay === day) {
    setFilter({ day: null });
  } else {
    setFilter({ day: day });
  }
}

// --- project click handlers ---
let dblClickTimer = null;
function onProjectClick(projectPath) {
  if (dblClickTimer) {
    // Double-click detected
    clearTimeout(dblClickTimer);
    dblClickTimer = null;
    onProjectDblClick(projectPath);
    return;
  }
  dblClickTimer = setTimeout(() => {
    dblClickTimer = null;
    // Single click: toggle project filter
    if (state.filterProject === projectPath) {
      setFilter({ project: null });
    } else {
      setFilter({ project: projectPath });
    }
  }, 250);
}

function onProjectDblClick(projectPath) {
  // Set filter and switch to Token Usage tab, highlight project
  state.filterProject = projectPath;
  showTab('cost');
  // After render, find and highlight the matching project row
  setTimeout(() => {
    const rows = document.querySelectorAll('.project-row[data-project]');
    for (const row of rows) {
      if (row.dataset.project === projectPath) {
        row.classList.add('highlight');
        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setTimeout(() => row.classList.remove('highlight'), 5000);
        break;
      }
    }
  }, 50);
}

// --- rendering ---
function loadAll() {
  const d = window.TRACKER_DATA;
  if (!d) {
    document.getElementById('tabContent').innerHTML = '<div class="no-data">No data.js found.<br><br>Run <code>node scripts/build.js</code> in the project directory, then reload this page.</div>';
    return;
  }
  state.stats = d.stats;
  state.tokens = d.tokens;
  state.history = d.history;
  state.events = d.events;

  const thisMonth2 = new Date().toISOString().slice(0, 7);
  const monthCostHeader = Object.entries(d.tokens?.perDay || {})
    .filter(([day]) => day.startsWith(thisMonth2))
    .reduce((sum, [, v]) => sum + v.cost, 0);
  document.getElementById('totalCostHeader').textContent = `$${monthCostHeader.toFixed(2)} this month`;

  if (d.generatedAt) {
    const ago = formatRelative(new Date(d.generatedAt));
    const el = document.getElementById('freshness');
    if (el) el.textContent = `data: ${ago}`;
  }

  renderCleanupBanner(d.maintenance);
  renderFilterBar();
  renderSidebar();
  showTab(state.activeTab);
}

function refresh() {
  alert('To refresh data, run:\n\n  node scripts/build.js\n\nthen reload this page.\n\n(Tip: this happens automatically after every Claude Code tool use, via the log_hook.)');
}

function renderCleanupBanner(m) {
  const el = document.getElementById('cleanupBanner');
  if (!el) return;
  if (!m || !m.oldFiles || !m.oldFiles.length) { el.innerHTML = ''; return; }
  const n = m.oldFiles.length;
  el.innerHTML = `
    <div class="banner">
      <span>You have <strong>${n}</strong> rotated event file${n > 1 ? 's' : ''} older than 6 months. Run the cleanup command to delete ${n > 1 ? 'them' : 'it'}.</span>
      <button class="banner-btn" onclick="showCleanupCommand()">Show command</button>
    </div>`;
}

function showCleanupCommand() {
  const m = window.TRACKER_DATA?.maintenance;
  const list = m?.oldFiles?.join('\n  ') || '';
  const msg = `To delete event files older than 6 months, run:\n\n  node scripts/build.js --cleanup\n\nFiles that will be removed:\n  ${list}`;
  if (navigator.clipboard) {
    navigator.clipboard.writeText('node scripts/build.js --cleanup').catch(() => {});
  }
  alert(msg);
}

function renderFilterBar() {
  const el = document.getElementById('filterBar');
  if (!hasFilters()) { el.innerHTML = ''; return; }

  let tags = '';
  if (state.filterProject) {
    const name = state.filterProject.split('/').slice(-2).join('/') || state.filterProject;
    tags += `<span class="filter-tag">Project: ${escHtml(name)} <span class="remove" onclick="clearFilterProject()">&times;</span></span>`;
  }
  if (state.filterDay) {
    tags += `<span class="filter-tag">Day: ${state.filterDay} <span class="remove" onclick="clearFilterDay()">&times;</span></span>`;
  }

  el.innerHTML = `<div class="filter-bar">
    <span class="filter-label">Filtered by</span>
    ${tags}
    <button class="filter-reset" onclick="clearFilters()">Reset all</button>
  </div>`;
}

function showTab(name) {
  state.activeTab = name;
  localStorage.setItem('claude-tracker-tab', name);
  document.querySelectorAll('.tab').forEach((t, i) => {
    const tabs = ['overview', 'cost', 'tools'];
    t.classList.toggle('active', tabs[i] === name);
  });
  renderTab(name);
}

function renderTab(name) {
  if (name === 'overview') renderOverview();
  else if (name === 'cost') renderCost();
  else if (name === 'feed') renderFeed();
  else if (name === 'tools') renderTools();
}

function renderSidebar() {
  // Top projects section — when filtered by day, recompute per-project costs for that day
  const projEl = document.getElementById('projectList');
  let projectsForSidebar;
  if (state.filterDay) {
    const pdMap = buildProjectDayMap();
    projectsForSidebar = Object.entries(pdMap)
      .map(([project, days]) => ({ project, cost: days[state.filterDay]?.cost || 0, prompts: days[state.filterDay]?.prompts || 0 }))
      .filter(p => p.cost > 0 || p.prompts > 0)
      .sort((a, b) => b.cost - a.cost)
      .slice(0, 10);
  } else {
    projectsForSidebar = (state.tokens?.projects || []).slice(0, 10);
  }
  if (!projectsForSidebar.length) {
    projEl.innerHTML = '<div class="no-data" style="padding:12px 16px">No projects</div>';
  } else {
    const maxCost = Math.max(0.0001, projectsForSidebar[0].cost);
    projEl.innerHTML = projectsForSidebar.map(p => {
      const name = p.project.split('/').slice(-2).join('/') || p.project;
      const pct = Math.round((p.cost / maxCost) * 100);
      const active = state.filterProject === p.project ? 'active' : '';
      return `<div class="sidebar-project ${active}" onclick="onProjectClick('${escAttr(p.project)}')" title="Double-click to jump to Token Usage">
        <div class="sp-name" title="${escHtml(p.project)}">${escHtml(name)}</div>
        <div class="sp-bar"><div class="sp-bar-fill" style="width:${pct}%"></div></div>
        <div class="sp-cost">$${p.cost.toFixed(2)}</div>
      </div>`;
    }).join('');
  }

  // Sessions section (filtered)
  const sessions = filteredSessions().slice(0, 60);
  const sessEl = document.getElementById('sessionList');
  if (!sessions.length) {
    sessEl.innerHTML = '<div class="no-data">No sessions</div>';
    return;
  }
  sessEl.innerHTML = sessions.map(s => {
    const when = s.lastTs ? formatSessionDate(new Date(s.lastTs)) : '—';
    const proj = (s.project || '').split('/').slice(-2).join('/');
    const cost = s.cost || 0;
    return `<div class="session-item">
      <div class="project">${proj || s.project}</div>
      <div class="preview">${s.sessionId.slice(0, 8)}… · ${s.counts?.messages || 0} turns</div>
      <div class="meta"><span class="cost-badge">$${cost.toFixed(4)}</span><span>${when}</span></div>
    </div>`;
  }).join('');
}

function renderOverview() {
  const s = state.stats;
  const t = state.tokens;
  if (!s || !t) { document.getElementById('tabContent').innerHTML = '<div class="no-data">Loading...</div>'; return; }

  const totals = t.totals || {};

  // Activity chart — last 14 days (prompts)
  const days = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    days.push(d.toISOString().slice(0, 10));
  }
  const perDay = t.perDay || {};
  const todayKey = new Date().toISOString().slice(0, 10);

  // Compute filtered chart data
  const pdMap = buildProjectDayMap();

  // For the Activity chart, count prompts per day (filtered by project if set)
  const activityValues = days.map(day => {
    if (state.filterProject) {
      return pdMap[state.filterProject]?.[day]?.prompts || 0;
    }
    return s.perDay[day] || 0;
  });

  // For the Cost chart, sum cost per day (filtered by project if set)
  const costValues = days.map(day => {
    if (state.filterProject) {
      return pdMap[state.filterProject]?.[day]?.cost || 0;
    }
    return perDay[day]?.cost || 0;
  });

  const todayCost = costValues[costValues.length - 1] || 0;
  const todayPrompts = activityValues[activityValues.length - 1] || 0;

  const thisMonth = todayKey.slice(0, 7);
  let monthCost;
  if (state.filterProject) {
    monthCost = Object.entries(pdMap[state.filterProject] || {})
      .filter(([d]) => d.startsWith(thisMonth))
      .reduce((sum, [, v]) => sum + v.cost, 0);
  } else {
    monthCost = Object.entries(perDay)
      .filter(([d]) => d.startsWith(thisMonth))
      .reduce((sum, [, v]) => sum + v.cost, 0);
  }

  // Command feed (filtered) — show in overview tab where Top Projects used to be
  const feedHtml = renderFeedItems(filterBySearch(filteredHistory().reverse()).slice(0, 20));

  document.getElementById('tabContent').innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="label">Extra Usage (equiv.)</div><div class="value green">$${monthCost.toFixed(2)}</div><div class="sub">this month · at API rates</div></div>
      <div class="stat"><div class="label">Today (equiv.)</div><div class="value green">$${todayCost.toFixed(4)}</div><div class="sub">${todayPrompts} prompts</div></div>
      <div class="stat"><div class="label">Input Tokens</div><div class="value blue">${fmtNum(totals.input_tokens)}</div><div class="sub">non-cached</div></div>
      <div class="stat"><div class="label">Output Tokens</div><div class="value blue">${fmtNum(totals.output_tokens)}</div><div class="sub">${fmtNum(totals.messages)} turns</div></div>
      <div class="stat"><div class="label">Cache Reads</div><div class="value purple">${fmtNum(totals.cache_read_input_tokens)}</div><div class="sub">${fmtNum(totals.cache_creation_input_tokens)} written</div></div>
    </div>
    <div class="chart-wrap">
      <h3>Activity — last 14 days (prompts)${state.filterProject ? ' · filtered' : ''}</h3>
      ${buildChart(days, activityValues, v => String(Math.round(v)), '', 'activity')}
    </div>
    <div class="chart-wrap">
      <h3>Equiv. extra usage cost — last 14 days (USD)${state.filterProject ? ' · filtered' : ''}</h3>
      ${buildChart(days, costValues, v => v >= 1 ? '$' + v.toFixed(1) : v > 0 ? '$' + v.toFixed(2) : '0', 'green', 'cost')}
    </div>
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <h3 style="margin-bottom:0">Recent Commands${hasFilters() ? ' (filtered)' : ''}</h3>
        <input type="text" id="feedSearchInput" placeholder="Search..." value="${escHtml(state.feedSearch)}" oninput="onFeedSearchOverview(this.value)" style="width:200px;padding:5px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;outline:none;font-family:inherit;" />
      </div>
      ${feedHtml || '<div class="no-data">No matching commands</div>'}
    </div>
  `;
}

function renderCost() {
  const t = state.tokens;
  if (!t) { document.getElementById('tabContent').innerHTML = '<div class="no-data">Loading...</div>'; return; }

  const totals = t.totals || {};
  const projects = t.projects || [];
  const maxCost = Math.max(0.0001, projects[0]?.cost || 0);

  const projectRows = projects.map(p => {
    const name = p.project.split('/').slice(-3).join('/') || p.project;
    const pct = Math.round((p.cost / maxCost) * 100);
    const isFiltered = state.filterProject === p.project;
    return `<div class="project-row${isFiltered ? ' highlight' : ''}" data-project="${escAttr(p.project)}">
      <div class="project-name" title="${p.project}">${name}</div>
      <div class="project-bar-bg"><div class="project-bar-fill" style="width:${pct}%"></div></div>
      <div class="project-cost">$${p.cost.toFixed(3)}</div>
    </div>`;
  }).join('');

  // Per day table (last 30 days)
  const dayKeys = Object.keys(t.perDay || {}).sort().reverse().slice(0, 30);
  const dayRows = dayKeys.map(d => {
    const day = t.perDay[d];
    return `<div class="row">
      <span class="key">${d}</span>
      <span style="display:flex;gap:24px;align-items:center">
        <span style="color:var(--muted);font-size:11px">${fmtNum(day.counts?.output_tokens)} out / ${fmtNum(day.counts?.cache_read_input_tokens)} cache read</span>
        <span class="val green">$${day.cost.toFixed(4)}</span>
      </span>
    </div>`;
  }).join('');

  document.getElementById('tabContent').innerHTML = `
    <div class="card">
      <h3>Token Totals (all time)</h3>
      <div class="token-detail">
        <div class="token-box"><div class="tval blue">${fmtNum(totals.input_tokens)}</div><div class="tlabel">Input tokens</div></div>
        <div class="token-box"><div class="tval blue">${fmtNum(totals.output_tokens)}</div><div class="tlabel">Output tokens</div></div>
        <div class="token-box"><div class="tval purple">${fmtNum(totals.cache_creation_input_tokens)}</div><div class="tlabel">Cache written</div></div>
        <div class="token-box"><div class="tval purple">${fmtNum(totals.cache_read_input_tokens)}</div><div class="tlabel">Cache read</div></div>
      </div>
    </div>
    <div class="card">
      <h3>Equiv. API Cost by Project <span style="font-size:11px;font-weight:400;color:var(--muted)">(subscription users: for reference only)</span></h3>
      ${projectRows || '<div class="no-data">No data</div>'}
    </div>
    <div class="card">
      <h3>Equiv. API Cost by Day <span style="font-size:11px;font-weight:400;color:var(--muted)">(subscription users: for reference only)</span></h3>
      ${dayRows || '<div class="no-data">No data</div>'}
    </div>
  `;
}

// Shared feed item renderer used by both Overview and Command Feed tabs
function renderFeedItems(items) {
  if (!items.length) return '';
  return `<div class="feed">${items.map(h => {
    const d = new Date(h.timestamp);
    const proj = (h.project || '').split('/').slice(-2).join('/');

    let pill;
    if (typeof h.cost !== 'number') {
      pill = `<span class="cost-pill na" title="No transcript data">—</span>`;
    } else {
      const cost = h.cost;
      const turns = h.turns || 0;
      const cls = cost === 0 ? 'zero' : cost < 0.01 ? '' : cost < 0.10 ? 'mid' : 'high';
      const label = cost === 0 ? '$0.00' : cost < 0.01 ? '$' + cost.toFixed(4) : '$' + cost.toFixed(3);
      const c = h.tokenCounts || {};
      const tip = `${turns} turn${turns === 1 ? '' : 's'}  ·  ${fmtNum(c.input_tokens)} in  ·  ${fmtNum(c.output_tokens)} out  ·  ${fmtNum(c.cache_read_input_tokens)} cache read  ·  ${fmtNum(c.cache_creation_input_tokens)} cache write`;
      pill = `<span class="cost-pill ${cls}" title="${tip}">${label}<span style="font-weight:400;opacity:0.7"> · ${turns}t</span></span>`;
    }

    return `<div class="feed-item">
      <div class="feed-head">
        <div class="prompt-text">${escHtml(h.display || '')}</div>
        ${pill}
      </div>
      <div class="prompt-meta">
        <span class="project">${proj}</span>
        <span>${d.toLocaleString()}</span>
        <span style="color:var(--muted);font-size:10px">${h.sessionId?.slice(0, 8)}…</span>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function renderFeed() {
  const items = filterBySearch(filteredHistory().reverse());
  const searchVal = escHtml(state.feedSearch);
  const searchBox = `<div style="margin-bottom:12px"><input type="text" id="feedSearchInput" placeholder="Search commands..." value="${searchVal}" oninput="onFeedSearch(this.value)" style="width:100%;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;outline:none;font-family:inherit;" /></div>`;
  if (!items.length) {
    document.getElementById('tabContent').innerHTML = searchBox + '<div class="no-data">No matching commands</div>';
    return;
  }
  document.getElementById('tabContent').innerHTML = searchBox + renderFeedItems(items);
  // Restore cursor position
  const inp = document.getElementById('feedSearchInput');
  if (inp) { inp.focus(); inp.selectionStart = inp.selectionEnd = inp.value.length; }
}

function onFeedSearch(val) {
  state.feedSearch = val;
  renderFeed();
}

function onFeedSearchOverview(val) {
  state.feedSearch = val;
  renderOverview();
  // Restore focus and cursor
  const inp = document.getElementById('feedSearchInput');
  if (inp) { inp.focus(); inp.selectionStart = inp.selectionEnd = inp.value.length; }
}

function filterBySearch(items) {
  const q = (state.feedSearch || '').trim().toLowerCase();
  if (!q) return items;
  return items.filter(h => {
    const text = (h.display || '').toLowerCase();
    const proj = (h.project || '').toLowerCase();
    return text.includes(q) || proj.includes(q);
  });
}

function renderTools() {
  const { toolCounts = {} } = state.stats || {};
  const entries = Object.entries(toolCounts).sort((a, b) => b[1] - a[1]);

  if (!entries.length) {
    document.getElementById('tabContent').innerHTML = `<div class="no-data">No tool events yet.</div>`;
    return;
  }

  const cards = entries.map(([tool, count]) => `
    <div class="tool-card">
      <div class="tool-name">${tool}</div>
      <div class="tool-count">${count}</div>
    </div>`).join('');

  const recentEvents = [...state.events].reverse().slice(0, 30);
  const eventRows = recentEvents.map(e => {
    const tool = e.tool_name || 'unknown';
    const tagClass = tool === 'Bash' ? 'bash' : tool.startsWith('Edit') || tool.startsWith('Write') ? 'edit' : 'tool';
    const input = e.tool_input ? JSON.stringify(e.tool_input).slice(0, 80) : '';
    return `<div class="feed-item">
      <div class="prompt-meta" style="margin:0">
        <span class="tag ${tagClass}">${tool}</span>
        <span class="tag" style="background:rgba(255,255,255,0.05);color:var(--muted)">${e.event_type}</span>
        <span style="color:var(--muted)">${new Date(e.timestamp).toLocaleString()}</span>
      </div>
      <div class="prompt-text" style="margin-top:6px;font-size:12px;color:var(--muted)">${escHtml(input)}</div>
    </div>`;
  }).join('');

  document.getElementById('tabContent').innerHTML = `
    <div class="tools-grid">${cards}</div>
    <div class="chart-wrap" style="margin-bottom:12px"><h3>Recent tool events (last 30)</h3></div>
    <div class="feed">${eventRows || '<div class="no-data">No events</div>'}</div>
  `;
}

function fmtNum(n) {
  if (!n) return '0';
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
  if (n >= 1_000) return (n / 1_000).toFixed(1) + 'K';
  return String(n);
}

function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escAttr(s) {
  return (s || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function formatSessionDate(d) {
  const today = new Date().toISOString().slice(0, 10);
  const dateStr = d.toISOString().slice(0, 10);
  if (dateStr === today) {
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

function formatRelative(d) {
  const diff = Date.now() - d.getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  return `${Math.floor(h/24)}d ago`;
}

loadAll();
</script>
